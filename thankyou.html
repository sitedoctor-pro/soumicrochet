pp" rel="noopener noreferrer" target="_blank">Confirmer plus vite sur WhatsApp</a><a class="btn btn-secondary" href="index.html">Retour à la boutique</a></div></section></div></main><script>(function(){const locale="fr";const base=document.documentElement.dataset.base||'./';let d=null;try{d=JSON.parse(sessionStorage.getItem('soumi_last_order')||'null')}catch(e){};if(!d)return;const set=(id,v)=>{const e=document.getElementById(id);if(e&&v!==undefined&&v!==null)e.textContent=v};set('thankProductName',d.product_name);set('thankProductPrice',locale==='ar'?`${d.price} درهم`:`${d.price} DH`);set('thankCustomerName',d.customer_name);set('thankCity',d.city);const img=document.getElementById('thankProductImage');if(img&&d.image_asset){img.src=(base+String(d.image_asset).replace(/^\/+/,''));img.alt=d.product_name||''}const wa=document.getElementById('thankWhatsapp');if(wa){const msg=locale==='ar'?`سلام، قمت بطلب ${d.product_name||'صاك'} بثمن ${d.price||''} درهم وبغيت نأكد التوصيل.`:`Bonjour, je viens de commander ${d.product_name||'un sac'} à ${d.price||''} DH et je souhaite confirmer la livraison.`;wa.href='https://wa.me/212662711995?text='+encodeURIComponent(msg)}})();</script></body></html>
